name: tests

on:
  push:
    branches: [master, py313]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    env:
      LANG: en_US.UTF-8
      PYTHONIOENCODING: UTF-8
      # The gazetteer entity resources are still served by the unmaintained
      # Snips CloudFront distribution, whose certificate no longer matches
      # resources.snips.ai. See insecure_download_enabled in
      # snips_nlu/cli/utils.py
      SNIPS_NLU_INSECURE_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install snips-nlu and its test dependencies
        run: |
          python -m pip install --upgrade pip setuptools setuptools-rust wheel
          python -m pip install -e ".[test]"

      - name: Download language resources
        run: |
          snips-nlu download-all-languages
          snips-nlu download-language-entities en
          snips-nlu download-language-entities fr

      - name: Run tests
        run: python -m pytest snips_nlu/tests --ignore=snips_nlu/tests/integration_test.py -q
