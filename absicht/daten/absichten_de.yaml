# Die Absichten, die heute erkannt werden — ausgezaehlt an 253 echten
# Nachrichten aus dem Betrieb. Diese Datei gehoert dem Bediener: sie laesst
# sich erweitern, ohne eine Zeile Python anzufassen.
#
# kurzbefehle   Nachrichten, die genau so lauten. Treffer hier sind stark
#               genug fuer den Weg "direkt".
# wendungen     Wortgruppen, die im laengeren Text vorkommen muessen — alle
#               Woerter, in beliebiger Reihenfolge. Treffer hier reichen in
#               der Regel fuer "aufbereitet".
# aktion        Was der Aufrufer tun soll. null heisst: nur antworten.
# folgenreich   true fuer alles, was verschickt, loescht oder freigibt. Diese
#               Absichten brauchen 0,95 statt 0,80.
# braucht_bezug ohne "ref" im Kontext nicht anwendbar.
# braucht_letzte_frage
#               ohne "letzte_frage" im Kontext bedeutungslos. Ein "ja" ins
#               Leere ist keine Zustimmung.
# verneinung_schliesst_aus
#               steht ein Verneinungswort in der Nachricht, ist diese Absicht
#               ausgeschlossen. Die harte Grenze aus dem Anforderungsdokument.

verneinung:
  # Steht eines dieser Woerter in der Nachricht, kann sie keine Zustimmung
  # sein. Siehe die harte Grenze in absicht/entscheidung.py.
  - nein
  - nee
  - ne
  - noe
  - nicht
  - kein
  - keine
  - keinen
  - keinesfalls
  - niemals
  - nix
  - nichts

absichten:

  ablehnung:
    aktion: ablehnen
    folgenreich: false
    braucht_bezug: true
    kurzbefehle:
      - nein
      - nee
      - ne
      - noe
      - nein danke
      - nein bitte nicht
      - negativ
      - auf keinen fall
      - lieber nicht
      - bloss nicht
      - eher nicht
      - will ich nicht
      - lass mal
      - lieber die andere
    wendungen:
      - [lieber, nicht]
      - [nicht, nehmen]
      - [nicht, schicken]
      - [nicht, abschicken]
      - [raus, nehmen]
      - [weg, damit]
      # [andere, zuerst] stand hier bis zum 06.08. — falsch. In den echten
      # Verlaeufen heisst "Bitte die anderen zuerst" nicht "wirf sie weg",
      # sondern "stell sie zurueck". Der Unterschied ist teuer: Ablehnung
      # verwirft die Bewerbung, Reihenfolge sortiert sie nur um. Siehe
      # Absicht `reihenfolge` weiter unten.

  zustimmung:
    aktion: freigeben
    folgenreich: true
    braucht_bezug: true
    braucht_letzte_frage: true
    verneinung_schliesst_aus: true
    kurzbefehle:
      - ja
      - jo
      - joa
      - jep
      - jup
      - jawohl
      - klar
      - alles klar
      - ok
      - oke
      - okey
      - fertig
      - erledigt
      - passt
      - passt so
      - so passt das
      - ja so passt das
      - einverstanden
      - genau
      - richtig
      - stimmt
      - gerne
      - mach das
      - kann raus
      - freigabe
      - freigegeben
      - abschicken
    wendungen:
      - [so, passt]
      - [kann, raus]
      - [kannst, abschicken]
      - [ist, gut, so]

  anschreiben_aendern:
    aktion: null
    folgenreich: false
    llm_auftrag:
      zweck: textaenderung
      prompt_bausteine: [persona, anschreiben_aktuell]
      weglassen: [werkzeuge, bewerbungsliste, verhaltensregeln]
    wendungen:
      - [absatz, lang]
      - [absatz, kurz]
      - [absatz, weg]
      - [absatz, aendern]
      - [anschreiben, aendern]
      - [anschreiben, kuerzer]
      - [anschreiben, laenger]
      - [anschreiben, neu]
      - [text, kuerzer]
      - [text, aendern]
      - [zu, lang]
      - [zu, kurz]
      - [zu, foermlich]
      - [neu, formulieren]
      - [anders, formulieren]
      - [umschreiben]
      - [einleitung, aendern]
      - [schluss, aendern]

  lebenszeichen:
    # Nur bei kurzen Nachrichten. "Hallo" allein ist ein Lebenszeichen,
    # "Hallo, bekomme ich eine Antwort im Portal?" ist eine Frage — die
    # gehoert ans Modell. Bis zum 06.08. fing die Regel beides.
    hoechstlaenge: 26
    aktion: null
    folgenreich: false
    kurzbefehle:
      - hallo
      - hallo?
      - hallo??
      - hey
      - huhu
      - bist du da
      - bist du noch da
      - bist du da?
      - jemand da
      - mit wem rede ich
      - mit wem schreibe ich
      - wer bist du
      - lebst du noch
      - geht es weiter
      - was ist los
      - immer noch nichts
    wendungen:
      - woerter: [bist, du, da]
        sicherheit: 0.90
      - woerter: [jemand, da]
        sicherheit: 0.90

  fachkorrektur:
    aktion: null
    folgenreich: false
    llm_auftrag:
      zweck: fachliche_korrektur
      prompt_bausteine: [persona, anschreiben_aktuell, fachangaben]
      weglassen: [werkzeuge, bewerbungsliste, verhaltensregeln]
    wendungen:
      - [nicht, kw]
      - [nicht, kilowatt]
      - [ampere]
      - [ampere, schreiben]
      - [nicht, sondern]
      - [muss, heissen]
      - [falsche, angabe]
      - [stimmt, nicht, sondern]

  unterlagen:
    aktion: null
    folgenreich: false
    braucht_bezug: true
    llm_auftrag:
      zweck: unterlagen
      prompt_bausteine: [persona, unterlagenliste]
      weglassen: [werkzeuge, bewerbungsliste, verhaltensregeln]
    wendungen:
      # Wer "Zeugnis" und "loeschen" schreibt, meint genau das. Diese
      # Wortpaare sind eindeutig genug fuer eine eigene Antwort mit Link ins
      # Portal — das spart den Modellaufruf ganz.
      - woerter: [zeugnis, loeschen]
        sicherheit: 0.85
      - woerter: [zeugnis, entfernen]
        sicherheit: 0.85
      - woerter: [zeugnis, tauschen]
        sicherheit: 0.85
      - woerter: [lebenslauf, aendern]
        sicherheit: 0.85
      - woerter: [lebenslauf, tauschen]
        sicherheit: 0.85
      - woerter: [unterlagen, aendern]
        sicherheit: 0.85
      - woerter: [dokument, loeschen]
        sicherheit: 0.85
      - woerter: [foto, tauschen]
        sicherheit: 0.85
      - [zeugnis, neu]
      - [lebenslauf, neu]
      - [bescheinigung]
      - woerter: [zeugnis]
        sicherheit: 0.70
      - woerter: [lebenslauf]
        sicherheit: 0.70

  dank:
    aktion: null
    folgenreich: false
    kurzbefehle:
      - danke
      - danke dir
      - dankeschoen
      - vielen dank
      - besten dank
      - merci
      - okay danke
      - ok danke
      - alles klar danke
      - passt danke
      - super danke
      - top danke
    wendungen:
      - woerter: [danke]
        sicherheit: 0.90
      - woerter: [dankeschoen]
        sicherheit: 0.90

  statusfrage:
    aktion: null
    folgenreich: false
    llm_auftrag:
      zweck: auskunft
      prompt_bausteine: [persona, bewerbungsliste]
      weglassen: [werkzeuge, anschreiben_aktuell, verhaltensregeln]
    wendungen:
      - [wieviele, bewerbungen]
      - [wie, viele, bewerbungen]
      - [zur, ansicht]
      - [wie, weit]
      - [wie, ist, der, stand]
      - [was, ist, der, stand]
      - [wie, laeuft]
      - woerter: [stand]
        sicherheit: 0.62
      # Aus dem Betrieb nachgetragen (06.08.). Zwei Gruppen:
      #
      # Erstens der Portal-Knopf: "Ich brauche Hilfe bei der Bewerbung
      # 0067 - was fehlt da?" ist keine getippte Frage, sondern eine
      # erzeugte Nachricht. Sie kommt woertlich immer gleich und ist
      # deshalb sicher zu erkennen - 10 von 14 Statusfragen im Bestand
      # sind genau diese.
      - woerter: [brauche, hilfe, bewerbung]
        sicherheit: 0.95
      - woerter: [was, fehlt]
        sicherheit: 0.85
      # Zweitens getippte Fragen, samt Tippfehlern. "was fehtl hier",
      # "was fhelt denn hier" - beides steht so in den Verlaeufen. Wer
      # nur sauberes Schriftdeutsch erkennt, faengt keine davon.
      - woerter: [fehtl]
        sicherheit: 0.80
      - woerter: [fhelt]
        sicherheit: 0.80
      - [geht, das]
      - [klappt, das]
      - [laeuft, das]

  reihenfolge:
    # Neu am 06.08., aus den Verlaeufen: Der Bewerber steuert, was zuerst
    # bearbeitet wird. "Zuerst die anderen", "Ist wichtiger", "Es ist
    # dringend" - elf Vorkommen im Bestand.
    #
    # Ausdruecklich NICHT `ablehnung`: Wer "die anderen zuerst" sagt, will
    # nichts wegwerfen, sondern umsortieren. Das ist keine Wortklauberei -
    # eine falsch als Ablehnung gelesene Umsortierung verwirft eine
    # Bewerbung, an der schon gearbeitet wurde.
    #
    # `folgenreich`, weil sie die Arbeitsreihenfolge aendert. Aber ohne
    # Bezug ist sie bedeutungslos: "zuerst die anderen" - welche?
    aktion: umsortieren
    folgenreich: true
    braucht_bezug: true
    llm_auftrag:
      zweck: priorisierung
      prompt_bausteine: [bewerbungsliste]
      weglassen: [werkzeuge, anschreiben_aktuell, verhaltensregeln]
    kurzbefehle:
      - zuerst die anderen
      - die anderen zuerst
      - die andere zuerst
      - erst die anderen
      - ist wichtiger
      - es ist dringend
      - das ist dringend
      - eilt
    wendungen:
      - [anderen, zuerst]
      - [andere, zuerst]
      - [anderen, sachen, zuerst]
      - [erst, die]
      - woerter: [dringend]
        sicherheit: 0.85
      - woerter: [wichtiger]
        sicherheit: 0.85
      - woerter: [vorziehen]
        sicherheit: 0.85
