[tox]
envlist = py39, py310, py311, py312, py313, integration-test, codecov, docs-html

[testenv]
skip_install = true
commands =
    pip install -e ".[test]" --upgrade --upgrade-strategy eager

    snips-nlu download-all-languages
    snips-nlu download-language-entities fr
    snips-nlu download-language-entities en
    coverage run -m unittest discover
    python snips_nlu_samples/sample.py
setenv=
    LANG=en_US.UTF-8
    PYTHONIOENCODING=UTF-8
    # The gazetteer entity resources are still served by the unmaintained
    # Snips CloudFront distribution, whose certificate no longer matches
    # resources.snips.ai. See insecure_download_enabled in
    # snips_nlu/cli/utils.py
    SNIPS_NLU_INSECURE_DOWNLOAD=1

[testenv:integration-test]
basepython = python3.13
skip_install = true
commands =
    pip install -e ".[test]" --upgrade --upgrade-strategy eager
    # Installed without its dependencies: the published metadata of
    # snips-nlu-metrics still pins numpy<2 and scikit-learn<0.23, which would
    # downgrade this stack. Its code runs fine on the current versions.
    pip install --no-deps "snips-nlu-metrics>=0.15"

    snips-nlu download-all-languages

    python -m unittest discover -p 'linting_test*.py'
    python -m unittest discover -p 'integration_test*.py'

[testenv:docs-html]
skip_install = true
deps = sphinx
allowlist_externals = sh
commands =
    sh docs/check_doc.sh
    pip install -e ".[test,doc]" --upgrade --upgrade-strategy eager
    python -m unittest discover -p 'doctests.py'
    python -m doctest README.rst
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs/source {envtmpdir}/html


[testenv:coverage-report]
deps = coverage
skip_install = true
commands =
    coverage combine
    coverage report
